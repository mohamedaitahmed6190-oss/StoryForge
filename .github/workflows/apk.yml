name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths: ['apk/**', '.github/workflows/apk.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build release APK
        run: gradle -p apk assembleRelease --no-daemon
      - name: Rename APK
        run: cp apk/app/build/outputs/apk/release/app-release.apk StoryForge.apk
      - uses: actions/upload-artifact@v4
        with:
          name: StoryForge-apk
          path: StoryForge.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: StoryForge APK ${{ github.run_number }}
          files: StoryForge.apk
