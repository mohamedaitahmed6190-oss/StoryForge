plugins { id 'com.android.application' }
android {
    namespace 'com.storyforge.books'
    compileSdk 34
    defaultConfig {
        applicationId 'com.storyforge.books'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    signingConfigs {
        release {
            storeFile file('storyforge.jks')
            storePassword 'storyforge2026'
            keyAlias 'storyforge'
            keyPassword 'storyforge2026'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
